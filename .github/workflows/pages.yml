name: Deploy Moonstone Forest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract built web game
        run: unzip -oq moonstone_forest_github_pages.zip -d prepared
      - uses: actions/upload-pages-artifact@v4
        with:
          path: prepared/site
      - id: deployment
        uses: actions/deploy-pages@v4
